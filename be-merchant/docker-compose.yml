  services:
    postgres:                                                                                                                                   
      image: postgres:16
      container_name: berijalan-db
      environment:
        POSTGRES_DB: berijalan_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - berijalan-db-data:/var/lib/postgresql/data

    redis:
      image: redis:7
      container_name: berijalan-redis
      ports:
        - "6379:6379"

  volumes:
    berijalan-db-data: